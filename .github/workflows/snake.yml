
name: Generate Purple Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Purple Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Yzknik
          outputs: |
            dist/github-snake-purple.svg?color_snake=%23C084FC&color_dots=%23171524,%233B0764,%236D28D9,%23A855F7,%23D8B4FE

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
